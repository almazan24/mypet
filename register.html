<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Mascota</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="register-container">
        <h1>Registro de Mascota</h1>
        <form id="registerForm">
            <label for="ownerName">Nombre del dueño:</label>
            <input type="text" id="ownerName" required>
            
            <label for="username">Usuario:</label>
            <input type="text" id="username" required>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" required>

            <label for="phone">Teléfono:</label>
            <input type="tel" id="phone" required>

            <label for="address">Dirección:</label>
            <input type="text" id="address" required>

            <label for="petName">Nombre de la Mascota:</label>
            <input type="text" id="petName" required>

            <label for="petType">Tipo de Mascota:</label>
            <input type="text" id="petType" required>

            <label for="petBreed">Raza:</label>
            <input type="text" id="petBreed" required>

            <label for="petColor">Color:</label>
            <input type="text" id="petColor" required>

            <label for="petDesc">Descripción de la mascota:</label>
            <input type="text" id="petDesc" required>

            <label for="petImage">Foto de la Mascota:</label>
            <input type="file" id="petImage" accept="image/*" required>

            <button type="submit" class="btn">Registrar</button>
            <button class="btn" type="button" onclick="window.location.href='index.html'">Regresar al inicio</button>

        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
